<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Admin</title><link rel="stylesheet" href="/admin/style.css"></head>
<body>
<div id="login" class="login-shell"><form id="login-form" class="login-card"><div class="mark">N</div><h1>Nova Admin</h1><p>Sign in to manage the website.</p><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><p id="login-message" class="message" role="alert"></p></form></div>
<div id="app" hidden><aside class="sidebar"><div class="side-brand"><span class="mark">N</span><span>Nova <small>Website admin</small></span></div><nav><button data-view="home" class="active">Home page</button><button data-view="services">Services</button><button data-view="blog">Repair guides</button><button data-view="work">Our work</button><button data-view="brands">Brands</button><button data-view="pages">Site pages</button></nav><div class="side-bottom"><a href="/" target="_blank">View website ↗</a><button id="logout">Sign out</button></div></aside><main class="main"><header class="top"><div><span class="top-kicker">CONTENT MANAGER</span><h1 id="view-title">Home page</h1></div><div class="top-actions"><span id="status" role="status"></span><button id="save" class="primary">Save and publish</button></div></header><div id="workspace"></div></main></div>
<script src="/admin/app.js"></script></body></html>
