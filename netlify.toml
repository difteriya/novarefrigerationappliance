# Netlify deployment config for Nova Refrigeration & Appliance Repair
#
# Connect this repo at https://app.netlify.com (New site from Git → pick this repo).
# Netlify runs the build command, publishes the output, and automatically detects
# the contact form (it has name="service-request" + data-netlify="true").
# Submissions appear under Site → Forms in the Netlify dashboard.

[build]
  # Regenerate all pages from build.js on every deploy, so editing build.js
  # and pushing is all that's needed to update the live site.
  command = "node build.js"
  # Site root — all generated .html plus css/ and js/ live here.
  publish = "."

[build.environment]
  NODE_VERSION = "20"
